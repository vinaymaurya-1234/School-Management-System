name: School ERP CI

on:
  push:
    branches:
      - feature/school-system-foundation
  pull_request:
    branches:
      - main
      - feature/school-system-foundation

permissions:
  contents: write

jobs:
  validate:
    name: Lockfiles, lint, build and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize npm lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix client
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix server
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && ! git diff --quiet -- client/package-lock.json server/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/package-lock.json server/package-lock.json
            git commit -m "chore: synchronize npm lockfiles [skip ci]"
            git push
          fi

      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Lint client
        run: npm run lint --prefix client
      - name: Build client
        run: npm run build --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Check server JavaScript syntax
        run: find server/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: npm test --prefix server
